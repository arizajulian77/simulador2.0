<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de circuitos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#d8dce3;--ac:#2563eb;--on:#16a34a;--off:#9ca3af;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f27;--tx:#e8eaf0;--mu:#9aa1b0;--bd:#323746;--ac:#60a5fa;--on:#4ade80;--off:#4b5263;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f27;--tx:#e8eaf0;--mu:#9aa1b0;--bd:#323746;--ac:#60a5fa;--on:#4ade80;--off:#4b5263;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mu{color:var(--mu);font-size:13px}
input[type=number]{width:90px}
.led{width:22px;height:22px;border-radius:50%;background:var(--off);display:inline-block;border:2px solid var(--bd)}
.led.h{background:var(--on);box-shadow:0 0 10px var(--on)}
.sw{min-width:64px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:14px}td,th{border:1px solid var(--bd);padding:3px 10px;text-align:center}
td.h{background:var(--on);color:#04210f;font-weight:600}
svg text{fill:var(--tx);font-size:12px}
.stat{display:flex;gap:16px;flex-wrap:wrap}.stat b{font-size:17px}
.cb{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.bar{height:12px;border-radius:6px;background:linear-gradient(90deg,hsl(220,80%,50%),hsl(110,80%,50%),hsl(0,80%,50%));max-width:260px}
</style></head><body><main>
<h1>⚡ Simulador de circuitos</h1>
<div class="tabs"><button id="t1" class="on">Compuertas lógicas</button><button id="t2">Resistencias</button></div>

<section id="logic">
<div class="card"><b>Entradas</b> <span class="mu">(toca para cambiar 0/1)</span><div class="row" id="ins" style="margin-top:8px"></div></div>
<div class="card"><b>Compuertas</b> <span class="mu">cada una puede usar entradas o salidas de compuertas anteriores</span>
<div id="gates" style="margin-top:8px"></div><button id="addG">+ Agregar compuerta</button></div>
<div class="card scroll"><b>Tabla de verdad</b><div id="tt" style="margin-top:8px"></div></div>
</section>

<section id="res" hidden>
<div class="card"><div class="row"><b>Fuente</b><input type="range" id="vr" min="1" max="48" step="0.5" value="12"><input type="number" id="vn" value="12" min="0.1" step="0.5"> V</div>
<div class="stat" id="sum" style="margin-top:8px"></div></div>
<div class="card scroll"><svg id="svg" height="300" width="100%"></svg>
<div class="row mu" style="margin-top:6px">Color por voltaje: <span>bajo</span><div class="bar" style="width:140px"></div><span>alto</span></div></div>
<div class="card"><b>Etapas en serie</b> <span class="mu">dentro de cada etapa las resistencias van en paralelo</span><div id="stages" style="margin-top:8px"></div><button id="addS">+ Etapa en serie</button></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function tab(n){$('logic').hidden=n!=1;$('res').hidden=n!=2;$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':''}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

/* ---------- LÓGICA ---------- */
const F={AND:(a,b)=>a&b,OR:(a,b)=>a|b,NOT:a=>+!a,NAND:(a,b)=>+!(a&b),NOR:(a,b)=>+!(a|b),XOR:(a,b)=>a^b,XNOR:(a,b)=>+!(a^b)};
const IN=['A','B','C'];let inv={A:0,B:0,C:0};
let gates=[{t:'AND',a:'A',b:'B'},{t:'NOT',a:'C',b:'A'},{t:'OR',a:'G1',b:'G2'}];
function evalAll(iv){const v={...iv};gates.forEach((g,i)=>{v['G'+(i+1)]=F[g.t](v[g.a]||0,v[g.b]||0)});return v}
function srcs(i){return IN.concat(gates.slice(0,i).map((_,k)=>'G'+(k+1)))}
function gateSvg(t,a,b,o){
 const c=x=>x?'var(--on)':'var(--off)',bub=['NAND','NOR','XNOR','NOT'].includes(t),not=t=='NOT',orl=['OR','NOR','XOR','XNOR'].includes(t);
 const body=not?'M10 6L40 20L10 34Z':orl?'M8 4Q32 4 48 20Q32 36 8 36Q18 20 8 4Z':'M10 4H28A16 16 0 0 1 28 36H10Z';
 const end=not?40:orl?48:44,ox=end+(bub?6:0),w=(x1,y1,x2,y2,v)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c(v)}" stroke-width="2.5"/>`;
 let s=`<svg width="80" height="40" viewBox="0 0 80 40">`;
 s+=not?w(0,20,12,20,a):w(0,12,13,12,a)+w(0,28,13,28,b);
 s+=`<path d="${body}" fill="var(--card)" stroke="var(--tx)" stroke-width="2"/>`;
 if(t=='XOR'||t=='XNOR')s+='<path d="M2 4Q12 20 2 36" fill="none" stroke="var(--tx)" stroke-width="2"/>';
 if(bub)s+=`<circle cx="${end+3}" cy="20" r="3" fill="var(--card)" stroke="var(--tx)" stroke-width="2"/>`;
 return s+w(ox,20,78,20,o)+'</svg>';
}
function drawLogic(){
 const v=evalAll(inv);
 $('ins').innerHTML='';IN.forEach(k=>{const b=document.createElement('button');b.className='sw'+(inv[k]?' on':'');b.textContent=k+' = '+inv[k];b.onclick=()=>{inv[k]^=1;drawLogic()};$('ins').append(b)});
 const box=$('gates');box.innerHTML='';
 gates.forEach((g,i)=>{
  const d=document.createElement('div');d.className='row';d.style.marginBottom='8px';
  const opt=(l,s)=>l.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');
  d.innerHTML=`<b>G${i+1}</b><select data-k="t">${opt(Object.keys(F),g.t)}</select><select data-k="a">${opt(srcs(i),g.a)}</select>${g.t=='NOT'?'':`<select data-k="b">${opt(srcs(i),g.b)}</select>`}${gateSvg(g.t,v[g.a],v[g.b],v['G'+(i+1)])}<span class="led ${v['G'+(i+1)]?'h':''}"></span><b>${v['G'+(i+1)]}</b><button data-x="1">✕</button>`;
  d.querySelectorAll('select').forEach(s=>s.onchange=()=>{g[s.dataset.k]=s.value;drawLogic()});
  d.querySelector('[data-x]').onclick=()=>{gates.splice(i,1);const rm='G'+(i+1);gates.forEach((h,j)=>{['a','b'].forEach(p=>{const m=/^G(\d+)$/.exec(h[p]);if(m){const n=+m[1];h[p]=n==i+1?'A':n>i+1?'G'+(n-1):h[p]}})});drawLogic()};
  box.append(d)});
 let h='<table><tr>'+IN.concat(gates.map((_,i)=>'G'+(i+1))).map(x=>`<th>${x}</th>`).join('')+'</tr>';
 for(let n=0;n<8;n++){const iv={A:n>>2&1,B:n>>1&1,C:n&1},r=evalAll(iv);h+='<tr>'+IN.map(k=>`<td>${iv[k]}</td>`).join('')+gates.map((_,i)=>`<td class="${r['G'+(i+1)]?'h':''}">${r['G'+(i+1)]}</td>`).join('')+'</tr>'}
 $('tt').innerHTML=h+'</table>';
}
$('addG').onclick=()=>{gates.push({t:'AND',a:'A',b:'B'});drawLogic()};

/* ---------- RESISTENCIAS ---------- */
let V=12,st=[[100],[220,330],[470]];
function fmt(x,u){const a=Math.abs(x);if(a==0)return '0 '+u;const p=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ']];for(const[s,c]of p)if(a>=s)return (+(x/s).toPrecision(3))+' '+c+u;return x.toExponential(1)+' '+u}
function drawCircuit(){
 const eq=st.map(s=>1/s.reduce((a,r)=>a+1/Math.max(r,.001),0)),Rt=eq.reduce((a,b)=>a+b,0),I=V/Rt;
 $('sum').innerHTML=`<span>R total<br><b>${fmt(Rt,'Ω')}</b></span><span>Corriente total<br><b>${fmt(I,'A')}</b></span><span>Potencia total<br><b>${fmt(V*I,'W')}</b></span>`;
 const W=90+st.length*170,maxN=Math.max(...st.map(s=>s.length)),H=Math.max(300,60+maxN*86+50),yb=H-30;
 const svg=$('svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('height',H);svg.style.minWidth=W+'px';
 const ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--mu)" stroke-width="2.5"/>`;
 let o=ln(40,50,40,yb-10)+ln(40,yb,W-30,yb)+ln(W-30,50,W-30,yb);
 o+=`<rect x="26" y="${yb/2-20}" width="28" height="40" fill="var(--card)"/><line x1="30" y1="${yb/2-10}" x2="50" y2="${yb/2-10}" stroke="var(--tx)" stroke-width="3"/><line x1="35" y1="${yb/2+8}" x2="45" y2="${yb/2+8}" stroke="var(--tx)" stroke-width="3"/><text x="58" y="${yb/2}" >${V} V</text>`;
 let x=40;o+=ln(40,50,40,50);
 st.forEach((s,i)=>{const x0=x+20,x1=x+150,Vs=I*eq[i],hue=220-220*Math.min(1,Vs/V);
  o+=ln(x,50,x0,50);
  if(s.length>1)o+=ln(x0,50,x0,50+(s.length-1)*86)+ln(x1,50,x1,50+(s.length-1)*86);
  s.forEach((r,j)=>{const y=50+j*86,im=Vs/r;
   o+=ln(x0,y,x0+22,y)+ln(x1-22,y,x1,y)+`<rect x="${x0+22}" y="${y-17}" width="86" height="34" rx="6" fill="hsl(${hue},80%,50%)" stroke="var(--tx)" stroke-width="1.5"/><text x="${(x0+x1)/2}" y="${y+4}" text-anchor="middle" style="fill:#fff;font-weight:700">${fmt(r,'Ω')}</text><text x="${(x0+x1)/2}" y="${y-24}" text-anchor="middle">${fmt(Vs,'V')} · ${fmt(im,'A')}</text><text x="${(x0+x1)/2}" y="${y+33}" text-anchor="middle">${fmt(Vs*im,'W')}</text>`});
  x=x1});
 o+=ln(x,50,W-30,50);svg.innerHTML=o;
}
const CN=['Negro','Marrón','Rojo','Naranja','Amarillo','Verde','Azul','Violeta','Gris','Blanco'],CH=['#111','#7a4a21','#e11d1d','#f97316','#facc15','#16a34a','#2563eb','#8b5cf6','#9ca3af','#fff'];
function setCB(el,R){
 const e=Math.floor(Math.log10(R)+1e-9);let d=Math.round(R/10**(e-1)),m=e-1;if(d>=100){d=10;m++}
 if(m<-2||m>9){el.textContent='fuera de rango';return}
 const cols=[[CN[d/10|0],CH[d/10|0]],[CN[d%10],CH[d%10]],m==-1?['Dorado','#d4af37']:m==-2?['Plata','#c0c0c0']:[CN[m],CH[m]],['Dorado','#d4af37']];
 const ap=Math.abs(d*10**m-R)/R>.005,xs=[16,26,36,54];
 el.innerHTML=`<svg width="72" height="22"><line x1="0" y1="11" x2="72" y2="11" stroke="var(--mu)" stroke-width="2"/><rect x="8" y="2" width="56" height="18" rx="8" fill="#e8d3a8" stroke="var(--mu)"/>${cols.map((k,i)=>`<rect x="${xs[i]}" y="2" width="5" height="18" fill="${k[1]}" stroke="#0003"/>`).join('')}</svg><span>${cols.map(k=>k[0]).join(' · ')}${ap?' (aprox.)':''}</span>`;
}
function drawStages(){
 const box=$('stages');box.innerHTML='';
 st.forEach((s,i)=>{const d=document.createElement('div');d.className='row';d.style.cssText='margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--bd)';
  d.innerHTML=`<b>Etapa ${i+1}</b>`;
  s.forEach((r,j)=>{const w=document.createElement('span');w.className='row';w.style.gap='4px';
   w.innerHTML=`<input type="number" min="0.1" step="10" value="${r}"> Ω<button title="Quitar">✕</button><span class="cb"></span>`;setCB(w.querySelector('.cb'),r);
   w.querySelector('input').oninput=e=>{s[j]=Math.max(.1,+e.target.value||.1);setCB(w.querySelector('.cb'),s[j]);drawCircuit()};
   w.querySelector('button').onclick=()=>{s.splice(j,1);if(!s.length)st.splice(i,1);if(!st.length)st.push([100]);drawStages();drawCircuit()};
   d.append(w)});
  const b=document.createElement('button');b.textContent='+ en paralelo';b.onclick=()=>{s.push(100);drawStages();drawCircuit()};d.append(b);
  box.append(d)});
}
$('addS').onclick=()=>{st.push([100]);drawStages();drawCircuit()};
$('vr').oninput=e=>{V=+e.target.value;$('vn').value=V;drawCircuit()};
$('vn').oninput=e=>{V=Math.max(.1,+e.target.value||.1);$('vr').value=V;drawCircuit()};
drawLogic();drawStages();drawCircuit();
</script></body></html>
